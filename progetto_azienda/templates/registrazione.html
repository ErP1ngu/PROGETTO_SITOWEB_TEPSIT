{% extends "base.html" %}
{% block title %}Registrazione{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<main class="auth-main">
    <div class="card">
        <h2>Crea un account</h2>
        <form action="{{ url_for('registrazione') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}" required minlength="3" maxlength="30">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password (almeno 8 caratteri)</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="conferma">Ripeti la password</label>
                <input type="password" id="conferma" name="conferma" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn">Registrati</button>
        </form>
        <p class="subtitle small">Hai già un account? <a href="{{ url_for('login') }}">Accedi</a></p>
    </div>
</main>
{% endblock %}
